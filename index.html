<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Canais Grátis</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">IPTV PLAYER</div>
      <h1>Canais Grátis</h1>
    </div>
    <button id="btnCustom" class="btn btn-secondary">+ URL</button>
  </header>

  <main class="wrap">
    <section class="hero">
      <h2>Escolha um canal</h2>
      <p>Toque em um canal para abrir o player.</p>
      <input id="busca" class="search" type="search" placeholder="Buscar canal...">
    </section>

    <div id="categorias" class="chips"></div>
    <div id="lista" class="grid"></div>
    <div id="vazio" class="empty" hidden>Nenhum canal encontrado.</div>
  </main>

  <div id="playerModal" class="modal" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <div class="eyebrow">AO VIVO</div>
          <h3 id="playerNome">Canal</h3>
        </div>
        <button id="fecharPlayer" class="close">✕</button>
      </div>
      <div class="video-box">
        <video id="video" controls playsinline></video>
      </div>
      <p id="status" class="status"></p>
    </div>
  </div>

  <div id="customModal" class="modal" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h3>Abrir URL</h3>
        <button id="fecharCustom" class="close">✕</button>
      </div>
      <input id="customUrl" class="search" placeholder="https://.../playlist.m3u8">
      <button id="abrirCustom" class="btn btn-primary full">Abrir no player</button>
    </div>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
